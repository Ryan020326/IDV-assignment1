<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0" > <title>Singapore PSI Readings</title> <style> body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; background-color: #f5f7fa; color: #222; } h1 { margin-bottom: 8px; } .description { color: #555; margin-bottom: 8px; } #timestamp { color: #666; margin-bottom: 20px; } .table-container { overflow-x: auto; background-color: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); } table { width: 100%; border-collapse: collapse; } th, td { padding: 12px; border: 1px solid #ddd; text-align: center; } th { background-color: #1769aa; color: white; } td:first-child { text-align: left; font-weight: bold; } tr:nth-child(even) { background-color: #f8f9fa; } tr:hover { background-color: #eef5ff; } #status { padding: 12px; margin-bottom: 16px; border-radius: 6px; background-color: #fff3cd; } .error { color: #842029; background-color: #f8d7da !important; } </style> </head> <body> <h1>Singapore PSI Readings</h1> <p class="description"> Real-time PSI data retrieved from data.gov.sg. </p> <p id="timestamp">Reading time: Loading...</p> <div id="status"> Loading PSI data... </div> <div class="table-container"> <table> <thead> <tr> <th>Reading</th> <th>National</th> <th>Central</th> <th>West</th> <th>East</th> <th>North</th> <th>South</th> </tr> </thead> <tbody id="psiTableBody"> </tbody> </table> </div> <script> const apiUrl = "https://api-open.data.gov.sg/v2/real-time/api/psi"; const readingNames = [ "o3_sub_index", "pm10_twenty_four_hourly", "pm10_sub_index", "co_sub_index", "pm25_twenty_four_hourly", "so2_sub_index", "co_eight_hour_max", "no2_one_hour_max", "so2_twenty_four_hourly", "pm25_sub_index", "psi_twenty_four_hourly", "o3_eight_hour_max" ]; async function getPSIData() { const status = document.getElementById("status"); const tableBody = document.getElementById("psiTableBody"); const timestampElement = document.getElementById("timestamp"); try { const response = await fetch(apiUrl); if (!response.ok) { throw new Error( `HTTP error. Status: ${response.status}` ); } const json = await response.json(); if ( !json.data || !json.data.items || json.data.items.length === 0 ) { throw new Error("No PSI data was returned by the API."); } const latestItem = json.data.items[0]; const readings = latestItem.readings; tableBody.innerHTML = ""; readingNames.forEach(function (readingName) { const values = readings[readingName]; const row = document.createElement("tr"); row.innerHTML = ` <td>${formatReadingName(readingName)}</td> <td>${getValue(values, "national")}</td> <td>${getValue(values, "central")}</td> <td>${getValue(values, "west")}</td> <td>${getValue(values, "east")}</td> <td>${getValue(values, "north")}</td> <td>${getValue(values, "south")}</td> `; tableBody.appendChild(row); }); const readingTime = latestItem.timestamp || latestItem.updatedTimestamp || latestItem.date; if (readingTime) { timestampElement.textContent = "Reading time: " + new Date(readingTime).toLocaleString("en-SG", { timeZone: "Asia/Singapore" }); } else { timestampElement.textContent = "Reading time: Not available"; } status.textContent = "PSI data loaded successfully."; status.classList.remove("error"); } catch (error) { console.error(error); status.textContent = "Unable to load PSI data: " + error.message; status.classList.add("error"); } } function getValue(reading, region) { if (!reading) { return "N/A"; } if (reading[region] === undefined) { return "N/A"; } return reading[region]; } function formatReadingName(name) { return name .replaceAll("_", " ") .replace(/\b\w/g, function (letter) { return letter.toUpperCase(); }); } getPSIData(); </script> </body> </html>
